name = "journaledge-api"
main = "src/worker.ts"
compatibility_date = "2026-08-11"

# Cloudflare Workers Observability: persist full logs and traces in the dashboard.
# Reduce both sampling rates before production traffic grows if cost control is needed.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[vars]
ALLOWED_ORIGINS = "https://app.learngermanwith.fun,https://admin.learngermanwith.fun,http://localhost:5173,http://127.0.0.1:5173"

[[r2_buckets]]
binding = "JOURNAL_VAULT"
bucket_name = "journaledge-vault"

# Set secrets with `wrangler secret put`:
# SUPABASE_URL
# SUPABASE_ANON_KEY
# VAULT_ENCRYPTION_KEY (base64 encoded 32-byte AES key)
