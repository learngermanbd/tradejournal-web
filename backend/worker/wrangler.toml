name = "journaledge-api"
main = "src/worker.ts"
compatibility_date = "2026-08-11"

[vars]
ALLOWED_ORIGINS = "https://app.learngermanwith.fun,https://community.learngermanwith.fun,https://admin.learngermanwith.fun,http://localhost:5173"

[[r2_buckets]]
binding = "JOURNAL_VAULT"
bucket_name = "journaledge-vault"

# Set secrets with `wrangler secret put`:
# SUPABASE_URL
# SUPABASE_ANON_KEY
# VAULT_ENCRYPTION_KEY (base64 encoded 32-byte AES key)
